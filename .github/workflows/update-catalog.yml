name: Weekly AI Stack Catalog Sync
on:
  schedule:
    - cron: '0 2 * * 1' # 每周一凌晨 2 点自动运行
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch OpenRouter Free & Coding Models
        run: |
          curl -s https://openrouter.ai/api/v1/models | jq '{updatedAt: now | todate, freeModels: [.data[] | select(.pricing.prompt == "0" and .pricing.completion == "0") | {id, name, context_length}]}' > live-models.json
      - name: Commit & Push Updated Catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add live-models.json
          git diff --staged --quiet || git commit -m "chore: weekly model catalog update" && git push
