<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Match</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    body {
      font-family: 'Inter', 'Noto Sans SC', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #f4f6fb;
      background-image:
        radial-gradient(at 15% 0%, rgba(79, 70, 229, 0.08) 0px, transparent 50%),
        radial-gradient(at 85% 0%, rgba(16, 185, 129, 0.07) 0px, transparent 45%);
      color: #0f172a;
    }
    .surface-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(226, 232, 240, 0.9);
      box-shadow: 0 8px 30px -10px rgba(15, 23, 42, 0.06);
    }
    .pill-active {
      background: linear-gradient(135deg, #4f46e5, #4338ca);
      color: #ffffff;
      border-color: #4338ca;
      box-shadow: 0 2px 8px -2px rgba(79, 70, 229, 0.4);
    }
    .pill-inactive {
      background-color: #ffffff;
      color: #334155;
      border-color: #e2e8f0;
    }
    .pill-inactive:hover {
      border-color: #818cf8;
      color: #4338ca;
      background-color: #eef2ff;
    }
    .mod-active {
      background: linear-gradient(135deg, #059669, #047857);
      color: #ffffff;
      border-color: #047857;
      box-shadow: 0 2px 8px -2px rgba(5, 150, 105, 0.35);
    }
    .mod-inactive {
      background-color: #ffffff;
      color: #334155;
      border-color: #e2e8f0;
    }
    .mod-inactive:hover {
      border-color: #34d399;
      color: #047857;
      background-color: #ecfdf5;
    }
    .fade-in {
      animation: fadeIn 0.25s ease-out;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col antialiased">

  <!-- Refined Header -->
  <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-white/85 backdrop-blur-md">
    <div class="max-w-5xl mx-auto px-4 sm:px-6 py-3 flex items-center justify-between gap-3">
      <!-- AI Match Brand + Custom Geometric Logo -->
      <div class="flex items-center gap-2.5">
        <svg class="w-9 h-9 shrink-0" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="AI Match Logo">
          <defs>
            <linearGradient id="aimGrad" x1="0" y1="0" x2="40" y2="40" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4F46E5" />
              <stop offset="55%" stop-color="#0EA5E9" />
              <stop offset="100%" stop-color="#10B981" />
            </linearGradient>
          </defs>
          <rect width="40" height="40" rx="12" fill="url(#aimGrad)" />
          <circle cx="14.5" cy="20" r="4.5" stroke="white" stroke-width="2.2" />
          <circle cx="25.5" cy="20" r="4.5" stroke="white" stroke-width="2.2" />
          <path d="M19 20H21" stroke="white" stroke-width="2.4" stroke-linecap="round" />
          <path d="M20 9.5L21.4 13.1L25 14.5L21.4 15.9L20 19.5L18.6 15.9L15 14.5L18.6 13.1L20 9.5Z" fill="white" fill-opacity="0.92" />
        </svg>
        <span class="text-lg sm:text-xl font-bold tracking-tight text-slate-900">AI <span class="bg-gradient-to-r from-indigo-600 to-emerald-600 bg-clip-text text-transparent">Match</span></span>
      </div>

      <!-- Top Actions: Bilingual Toggle + Live Sync -->
      <div class="flex items-center gap-2">
        <button type="button" id="langBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-slate-100 hover:bg-slate-200 text-slate-700 border border-slate-200 transition">
          <span>🌐</span>
          <span id="langBtnText">EN</span>
        </button>

        <button type="button" id="syncBtn" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-xl text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200 hover:bg-emerald-100 transition">
          <span id="syncIcon">🔄</span>
          <span id="syncText">同步最新模型与榜单</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-1 max-w-5xl w-full mx-auto px-4 sm:px-6 py-7 space-y-7 fade-in">

    <!-- Section 1: Configuration & Input -->
    <div class="surface-card rounded-3xl p-5 sm:p-7 space-y-6">

      <!-- Step 01: Project Type -->
      <div class="space-y-2.5">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-indigo-100 text-indigo-700 text-[11px] font-bold">01</span>
          <label id="lblStep1" class="text-xs sm:text-sm font-bold text-slate-800">选择项目形态</label>
        </div>
        <div id="projectTypeGroup" class="flex flex-wrap gap-2">
          <button type="button" class="type-pill pill-active px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="web">Web 网站</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="saas">SaaS 全栈应用</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="extension">浏览器插件</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="desktop">桌面软件</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="android">Android 移动应用</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="mobile_cross">iOS / 跨平台 App</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="miniprogram">小程序</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="cli">自动化脚本 / CLI</button>
          <button type="button" class="type-pill pill-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-type="agent">AI Agent / 工作流</button>
        </div>
      </div>

      <!-- Step 02: Core Modules -->
      <div class="space-y-2.5">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-emerald-100 text-emerald-700 text-[11px] font-bold">02</span>
          <label id="lblStep2" class="text-xs sm:text-sm font-bold text-slate-800">勾选核心功能件（可多选）</label>
        </div>
        <div id="moduleGroup" class="flex flex-wrap gap-2">
          <button type="button" class="mod-pill mod-active px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="frontend">前端界面 (UI/UX)</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="backend">后端服务</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="database">数据库存储</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="auth">用户登录鉴权</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="payment">支付订阅</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="api">第三方 API 集成</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="ai">AI 能力接入</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="data">数据采集 / 处理</button>
          <button type="button" class="mod-pill mod-inactive px-3.5 py-1.5 rounded-xl border text-xs font-medium transition" data-mod="local">本地离线 / 隐私</button>
        </div>
      </div>

      <!-- Step 03: Idea Input -->
      <div class="space-y-2.5">
        <div class="flex items-center gap-2">
          <span class="inline-flex items-center justify-center w-5 h-5 rounded-md bg-slate-200 text-slate-700 text-[11px] font-bold">03</span>
          <label id="lblStep3" for="ideaInput" class="text-xs sm:text-sm font-bold text-slate-800">补充具体想法与业务场景</label>
        </div>
        <textarea id="ideaInput" rows="3" class="w-full rounded-2xl border border-slate-200 bg-slate-50/60 focus:bg-white px-4 py-3 text-sm text-slate-900 placeholder-slate-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-500/10 outline-none transition" placeholder="请描述你的核心功能、目标用户或特殊需求..."></textarea>
      </div>

      <!-- Constraints Inset Bar -->
      <div class="rounded-2xl bg-slate-50/90 border border-slate-200/80 p-4 grid grid-cols-1 sm:grid-cols-3 gap-3.5">
        <div>
          <label id="lblBudget" for="budgetSelect" class="block text-xs font-semibold text-slate-600 mb-1.5">预算策略</label>
          <select id="budgetSelect" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs sm:text-sm text-slate-800 focus:border-indigo-500 outline-none shadow-sm">
            <option value="free" selected>极客零成本（$0 免费额度优先）</option>
            <option value="value">极致性价比（&lt;$10/月 或超低按量）</option>
            <option value="flagship">效果至上（不限预算，旗舰模型）</option>
          </select>
        </div>
        <div>
          <label id="lblRole" for="roleSelect" class="block text-xs font-semibold text-slate-600 mb-1.5">开发方式偏好</label>
          <select id="roleSelect" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs sm:text-sm text-slate-800 focus:border-indigo-500 outline-none shadow-sm">
            <option value="auto" selected>智能推荐（网页端优先/本地可选）</option>
            <option value="web">网页端在线开发（免装环境，打开即写）</option>
            <option value="dev">本地 IDE / 终端 CLI（完全掌控源码）</option>
          </select>
        </div>
        <div>
          <label id="lblPrivacy" for="privacySelect" class="block text-xs font-semibold text-slate-600 mb-1.5">网络与部署环境</label>
          <select id="privacySelect" class="w-full rounded-xl border border-slate-200 bg-white px-3 py-2 text-xs sm:text-sm text-slate-800 focus:border-indigo-500 outline-none shadow-sm">
            <option value="cloud" selected>全球云端标准 (Global Cloud API)</option>
            <option value="cn">亚太 / 中国直连优化 (Direct Access)</option>
            <option value="local">本地离线隐私 (Local &amp; Air-Gapped)</option>
          </select>
        </div>
      </div>

      <!-- AI Deep Understanding + Custom Model Config -->
      <div class="rounded-2xl border border-indigo-100 bg-indigo-50/40 p-4 space-y-3">
        <div class="flex flex-wrap items-center justify-between gap-2">
          <label class="inline-flex items-center gap-2 cursor-pointer text-xs sm:text-sm font-semibold text-indigo-950">
            <input type="checkbox" id="useAiToggle" class="rounded border-indigo-300 text-indigo-600 focus:ring-indigo-500" />
            <span id="lblAiToggle">🧠 开启 AI 深度理解（支持内置免费接口或自定义大模型）</span>
          </label>
          <span id="connStatusBadge" class="hidden text-xs font-medium px-2.5 py-0.5 rounded-full"></span>
        </div>

        <div id="aiKeyRow" class="hidden space-y-2.5 pt-1">
          <div class="grid grid-cols-1 sm:grid-cols-12 gap-2.5 items-center">
            <div class="sm:col-span-5">
              <select id="aiProviderSelect" class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-xs text-slate-800 outline-none">
                <option value="openrouter">OpenRouter Free Router (openrouter/free)</option>
                <option value="gemini">Google AI Studio (Gemini 4 Hydrogen)</option>
                <option value="custom">自定义 AI 大模型（OpenAI 兼容接口）</option>
              </select>
            </div>
            <div id="builtinKeyWrap" class="sm:col-span-5">
              <input type="password" id="aiApiKeyInput" placeholder="输入 API 私钥（仅本地直连官方接口）" class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-xs text-slate-900 outline-none" />
            </div>
            <div class="sm:col-span-2 flex items-center">
              <button type="button" id="testConnBtn" class="w-full py-2 px-3 rounded-xl bg-slate-900 hover:bg-indigo-600 text-white text-xs font-semibold transition">测试连接</button>
            </div>
          </div>

          <div id="customModelFields" class="hidden grid grid-cols-1 sm:grid-cols-3 gap-2.5 pt-1">
            <div>
              <label id="lblCustomName" for="customModelName" class="block text-xs text-slate-600 mb-1">模型名称 (Model ID)</label>
              <input type="text" id="customModelName" placeholder="deepseek-chat / qwen3.8-plus" class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-xs text-slate-900 outline-none" />
            </div>
            <div>
              <label id="lblCustomUrl" for="customModelUrl" class="block text-xs text-slate-600 mb-1">接口 URL</label>
              <input type="url" id="customModelUrl" placeholder="https://api.deepseek.com/v1/chat/completions" class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-xs text-slate-900 outline-none" />
            </div>
            <div>
              <label id="lblCustomKey" for="customModelKey" class="block text-xs text-slate-600 mb-1">API 私钥 (Key)</label>
              <input type="password" id="customModelKey" placeholder="sk-..." class="w-full rounded-xl border border-indigo-200 bg-white px-3 py-2 text-xs text-slate-900 outline-none" />
            </div>
          </div>

          <div id="freeKeyHintRow" class="flex items-center justify-between text-xs text-slate-500">
            <span id="lblKeyHint">密钥仅留存在当前浏览器内存中，点击「测试连接」可验证接口可用性与延迟。</span>
            <a id="getFreeKeyLink" href="https://openrouter.ai/keys" target="_blank" rel="noopener noreferrer" class="font-semibold text-indigo-600 hover:underline shrink-0">申请免费 Key ↗</a>
          </div>
        </div>
      </div>

      <!-- Primary CTA Row -->
      <div class="flex flex-wrap items-center justify-between gap-3 pt-1">
        <span id="lblShortcut" class="text-xs text-slate-400">支持 Ctrl / Cmd + Enter 快捷匹配</span>
        <button type="button" id="analyzeBtn" class="px-6 py-2.5 rounded-xl bg-gradient-to-r from-indigo-600 to-indigo-700 hover:from-indigo-700 hover:to-indigo-800 text-white text-sm font-semibold shadow-md shadow-indigo-500/20 transition flex items-center gap-2">
          <span>⚡</span>
          <span id="analyzeBtnText">开始智能匹配</span>
        </button>
      </div>
    </div>

    <!-- Section 2: Results -->
    <div id="resultsContainer" class="space-y-6">
      <!-- Diagnosis Banner -->
      <div id="analysisSummary" class="surface-card rounded-2xl p-4 sm:p-5 flex flex-wrap items-center justify-between gap-4 border-l-4 border-l-indigo-600">
        <div class="space-y-1 flex-1 min-w-[240px]">
          <div class="flex items-center gap-2 flex-wrap">
            <span id="engineBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-md bg-indigo-600 text-white">帕累托精准匹配</span>
            <span id="detectedArchetype" class="text-sm font-bold text-slate-900">Web 网站</span>
            <span id="detectedCostBadge" class="text-xs font-semibold px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800">预估成本：$0</span>
          </div>
          <p id="detectedReason" class="text-xs sm:text-sm text-slate-600 leading-relaxed"></p>
        </div>
        <div class="text-right shrink-0">
          <div id="lblMatchScore" class="text-xs text-slate-500">综合匹配度</div>
          <div id="matchScoreText" class="text-2xl font-bold text-indigo-600">97%</div>
        </div>
      </div>

      <!-- Winner Card -->
      <div id="winnerCard" class="surface-card rounded-3xl border-2 border-indigo-500/80 overflow-hidden"></div>

      <!-- Alternatives + Radar Chart -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
        <div class="lg:col-span-7 space-y-3">
          <h3 id="lblAltsTitle" class="text-sm font-bold text-slate-800 px-1">🔀 备选与进阶组合</h3>
          <div id="alternativesList" class="space-y-3"></div>
        </div>

        <div class="lg:col-span-5 surface-card rounded-3xl p-5 flex flex-col justify-between">
          <div>
            <h3 id="lblChartTitle" class="text-sm font-bold text-slate-800 mb-1">📊 四维能力对比</h3>
            <p id="lblChartSub" class="text-xs text-slate-500 mb-3">代码效果 · 成本优势 · 上手速度 · 生态部署</p>
          </div>
          <div class="relative h-72 w-full">
            <canvas id="comparisonChart"></canvas>
          </div>
        </div>
      </div>

      <!-- Precision Prompt Box -->
      <div class="surface-card rounded-3xl overflow-hidden">
        <div class="bg-slate-900 px-5 py-3 flex flex-wrap items-center justify-between gap-2">
          <div>
            <h3 id="lblPromptTitle" class="text-sm font-bold text-white">🛠️ 精准项目启动提示词</h3>
            <p id="lblPromptSub" class="text-xs text-slate-400">已按所选形态、功能件与架构规范生成，跳转工具后直接粘贴</p>
          </div>
          <button type="button" id="copyConfigBtn" class="px-3.5 py-1.5 rounded-xl bg-white/10 hover:bg-white/20 text-white text-xs font-semibold transition border border-white/15">📋 复制提示词</button>
        </div>
        <pre id="starterConfig" class="bg-slate-950 text-slate-100 p-5 text-xs overflow-x-auto leading-relaxed whitespace-pre-wrap"></pre>
      </div>
    </div>

  </main>

  <!-- Toast -->
  <div id="toast" class="fixed bottom-5 right-5 z-50 hidden rounded-xl bg-slate-900 text-white px-4 py-2.5 text-xs sm:text-sm shadow-lg transition"></div>

  <script>

    // 0. BILINGUAL I18N DICTIONARY (ZH / EN)

      if (privacyPref === 'cn' || sig.isCN) {
        if (tool.cnFriendly) s += 24;
        else if (!needLocal) s -= 18;
      }

      const canUseWeb = ['web', 'saas', 'agent', 'miniprogram'].includes(selectedType) || (selectedType === 'mobile_cross' && !needLocal);
      if (rolePref === 'web' || sig.isWebPref) {
        if (tool.isWebBased) s += 32;
        else s -= 28;
      } else if (rolePref === 'dev') {
        if (!tool.isWebBased) s += 22;
        else s -= 20;
      } else if (rolePref === 'auto' && budget === 'free' && canUseWeb && !needLocal) {
        if (tool.isWebBased) s += 8;
      }

      if (tool.tags.includes(selectedType)) s += 24;
      else s -= 20;

      if (selectedType === 'web') {
        if (budget === 'free' && ['v0', 'ai-studio-build', 'bolt'].includes(tool.id)) s += 10;
        if (budget === 'value' && ['trae', 'copilot', 'cline'].includes(tool.id)) s += 8;
        if (budget === 'flagship' && ['cursor', 'v0'].includes(tool.id)) s += 12;
      } else if (selectedType === 'saas') {
        if (budget === 'free' && ['lovable', 'firebase-studio', 'bolt', 'ai-studio-build'].includes(tool.id)) s += 12;
        if (budget === 'value' && ['kilo-code', 'cline', 'trae'].includes(tool.id)) s += 12;
        if (budget === 'flagship' && (rolePref === 'web' ? tool.id === 'lovable' : tool.id === 'cursor')) s += 16;
      } else if (selectedType === 'extension') {
        if (['cline', 'antigravity', 'cursor', 'trae'].includes(tool.id)) s += 14;
      } else if (selectedType === 'desktop') {
        if (['cline', 'kilo-code', 'cursor', 'antigravity', 'opencode'].includes(tool.id)) s += 14;
      } else if (selectedType === 'android') {
        if (tool.id === 'jetbrains-ai') s += 24;
        if (['firebase-studio', 'antigravity', 'kilo-code'].includes(tool.id)) s += 10;
      } else if (selectedType === 'mobile_cross') {
        if (budget === 'free' && tool.id === 'firebase-studio') s += 20;
        if (budget === 'value' && ['kilo-code', 'cline', 'trae'].includes(tool.id)) s += 10;
        if (budget === 'flagship' && tool.id === 'cursor') s += 14;
      } else if (selectedType === 'miniprogram') {
        if (tool.id === 'trae') s += 26;
        if (['cline', 'cursor'].includes(tool.id)) s += 10;
      } else if (selectedType === 'cli') {
        if (['aider', 'opencode', 'cline', 'claude-code'].includes(tool.id)) s += 22;
        if (tool.isWebBased) s -= 24;
      } else if (selectedType === 'agent') {
        if (['antigravity', 'opencode', 'cline', 'claude-code'].includes(tool.id)) s += 16;
      }

      if (selectedModules.has('backend') || selectedModules.has('database') || selectedModules.has('auth') || selectedModules.has('payment')) {
        if (['lovable', 'firebase-studio', 'bolt', 'cursor', 'cline', 'kilo-code'].includes(tool.id)) s += 6;
        if (tool.id === 'v0') s -= 10;
      }
      if ((selectedModules.has('data') || sig.isScript) && ['aider', 'cline', 'opencode', 'claude-code'].includes(tool.id)) s += sig.isScript ? 22 : 12;
      if (sig.isMobile && ['jetbrains-ai', 'firebase-studio', 'cursor'].includes(tool.id)) s += 18;
      if (sig.isExtension && ['cline', 'antigravity', 'cursor', 'trae'].includes(tool.id)) s += 16;
      if ((sig.isComplex || selectedModules.size >= 4) && ['claude-code', 'cursor', 'kilo-code', 'kiro', 'codex-cli'].includes(tool.id)) s += 12;
      if (budget === 'flagship' && selectedModules.size >= 4 && tool.id === 'claude-code') s += 12;

      return s;
    }

    function scoreModel(model, tool, budget, privacyPref, sig) {
      const allowed = TOOL_ALLOWED_MODELS[tool.id];
      if (allowed && !allowed.includes(model.id)) return -999;

      const needLocal = privacyPref === 'local' || ((selectedModules.has('local') || sig.isLocal) && budget !== 'flagship');
      if (needLocal && !model.isLocal) return -999;

      let s = 0;
      if (budget === 'free') {
        s = model.qualityScore * 0.35 + model.costScore * 0.65;
        if (!model.isFree) s -= 85;
        else s += 22;
      } else if (budget === 'value') {
        s = model.qualityScore * 0.68 + model.costScore * 0.32;
        if (['deepseek-v4-pro', 'deepseek-v4-flash'].includes(model.id)) s += 24;
        else if (['qwen-3.8-flash', 'glm-5.3-flash'].includes(model.id)) s += 16;
        else if (model.id === 'gemini-4-hydrogen') s += 8;
        if (model.costScore < 75) s -= 25;
      } else {
        s = model.qualityScore * 1.0;
        if (model.id === 'claude-fable-5.2') s += 32;
        else if (['gpt-6.1-sol', 'gemini-4-carbon', 'claude-sonnet-5.5', 'deepseek-v4-pro'].includes(model.id)) s += 16;
        if (model.isFree && !needLocal) s -= 65;
      }

      if (needLocal && model.isLocal) s += 40;
      else if (!needLocal && model.isLocal) s -= 35;

      if (privacyPref === 'cn' || sig.isCN) {
        if (model.cnFriendly) s += 20;
        else if (!model.isLocal) s -= 14;
      }

      if (sig.isComplex && model.qualityScore >= 95) s += 6;
      return s;
    }

    function computeLocalRecommendations(idea, budget, rolePref, privacyPref) {
      const t = I18N[lang];
      const typeLabel = t.types[selectedType] || TYPE_META[selectedType].label;
      const modLabels = Array.from(selectedModules).map(m => t.mods[m] || m);
      const sig = extractIdeaSignals(idea);

      const activeModels = MODELS.map(m => {
        if (m.id === 'openrouter-free' && liveFreeModels.length > 0) {
          const top = liveFreeModels[0];
          return {
            ...m,
            name: lang === 'en' ? `OpenRouter Free (${top.id})` : `OpenRouter 免费路由 (${top.id})`,
            pricing: `$0 / 1M · ${(top.context_length || 128000).toLocaleString()} ctx`,
            pricingEn: `$0 / 1M · ${(top.context_length || 128000).toLocaleString()} ctx`,
            url: `https://openrouter.ai/${top.id}`
          };
        }
        return m;
      });

      const toolScored = TOOLS.map(tl => ({ tool: tl, tScore: scoreTool(tl, budget, rolePref, privacyPref, sig) })).sort((a, b) => b.tScore - a.tScore);
      const candidates = [];

      for (const { tool, tScore } of toolScored) {
        const validModels = activeModels
          .map(m => ({ model: m, mScore: scoreModel(m, tool, budget, privacyPref, sig) }))
          .filter(x => x.mScore > -500)
          .sort((a, b) => b.mScore - a.mScore);

        if (validModels.length === 0) continue;
        const bestModelObj = validModels[0];
        const quality = Math.round(tool.qualityScore * 0.45 + bestModelObj.model.qualityScore * 0.55);
        const cost = Math.round(tool.costScore * 0.45 + bestModelObj.model.costScore * 0.55);
        const ease = tool.easeScore;
        const ecosystem = tool.ecosystemScore;
        const combined = tScore * 0.55 + bestModelObj.mScore * 0.45;

        let estCost = lang === 'en' ? '$0 / mo (Free Tier)' : '$0 / 月（免费额度内）';
        if (bestModelObj.model.isLocal && tool.supportsLocal) {
          estCost = lang === 'en' ? '$0 / mo (100% Offline)' : '$0 / 月（100% 本地离线）';
        } else if (budget === 'flagship') {
          estCost = tool.freeTier
            ? (lang === 'en' ? `~$20+/mo (${bestModelObj.model.provider} Flagship)` : `约 $20+/月（${bestModelObj.model.provider} 旗舰订阅/按量）`)
            : '$20 - $100 / mo';
        } else if (budget === 'value') {
          if (bestModelObj.model.id.includes('deepseek') || bestModelObj.model.id.includes('qwen') || bestModelObj.model.id.includes('glm')) {
            estCost = tool.supportsBYOK
              ? (lang === 'en' ? '~$0.3 - $3 / mo (Ultra-Low API)' : '约 $0.3 - $3 / 月（超低按量 API）')
              : (lang === 'en' ? '~$3 - $10 / mo' : '约 $3 - $10 / 月');
          } else if (tool.freeTier && bestModelObj.model.isFree) {
            estCost = lang === 'en' ? '$0 / mo (Free Tier)' : '$0 / 月（免费额度足够日常）';
          } else {
            estCost = lang === 'en' ? '~$8 - $10 / mo' : '约 $8 - $10 / 月';
          }
        } else if (!tool.freeTier || !bestModelObj.model.isFree) {
          estCost = bestModelObj.model.id.includes('deepseek') || bestModelObj.model.id.includes('qwen') || bestModelObj.model.id.includes('glm')
            ? (lang === 'en' ? '~$0.2 - $2 / mo' : '约 $0.2 - $2 / 月（超低按量）')
            : '$10 - $20 / mo';
        }

        candidates.push({ tool, model: bestModelObj.model, estCost, quality, cost, ease, ecosystem, sortKey: combined });
        if (candidates.length >= 6) break;
      }

      candidates.sort((a, b) => b.sortKey - a.sortKey);
      const topScore = candidates[0]?.sortKey || 100;
      const ranked = candidates.slice(0, 3).map((c, idx) => {
        const delta = Math.max(0, topScore - c.sortKey);
        const matchPct = Math.min(98, Math.max(76, Math.round(97 - delta * 0.35 - idx * 1.5)));
        return { ...c, total: matchPct };
      });

      const topTool = ranked[0].tool;
      const reason = lang === 'en'
        ? `Matched for "${typeLabel}" (${modLabels.slice(0, 4).join(', ')}) under ${t.budgets[budget]} strategy${topTool.isWebBased ? ' with direct browser workspace support' : ''}.`
        : `基于「${t.budgets[budget]}」策略，针对「${typeLabel}」及所选功能件（${modLabels.join('、')}）匹配最优组合${topTool.isWebBased ? '，支持直接在网页端零配置开发与上线' : ''}。`;

      return { engineLabel: t.engineLocal, archLabel: `${typeLabel} · ${modLabels.slice(0, 3).join(' + ')}`, reason, pairs: ranked };
    }

    async function testAiConnection() {
      const cfg = getAiConfig();
      const badge = document.getElementById('connStatusBadge');
      const btn = document.getElementById('testConnBtn');
      const t = I18N[lang];

      if (!cfg.apiKey || (cfg.provider === 'custom' && (!cfg.model || !cfg.url))) {
        badge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-amber-100 text-amber-800';
        badge.textContent = lang === 'en' ? '⚠️ Missing Model/URL/Key' : '⚠️ 请完善模型、URL 与私钥';
        badge.classList.remove('hidden');
        return;
      }

      btn.disabled = true;
      btn.textContent = t.testing;
      const t0 = performance.now();

      try {
        let res;
        if (cfg.provider === 'gemini') {
          res = await fetch(`${cfg.url}?key=${encodeURIComponent(cfg.apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: 'ping' }] }], generationConfig: { maxOutputTokens: 5 } })
          });
        } else {
          res = await fetch(cfg.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.apiKey}` },
            body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'ping' }], max_tokens: 5 })
          });
        }

        const ms = Math.round(performance.now() - t0);
        if (!res.ok) {
          const errBody = await res.text();
          throw new Error(`HTTP ${res.status}: ${errBody.slice(0, 50)}`);
        }

        badge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-emerald-100 text-emerald-800';
        badge.textContent = lang === 'en' ? `✅ Connected (${ms}ms)` : `✅ 连接成功 (${ms}ms)`;
        badge.classList.remove('hidden');
        showToast(lang === 'en' ? `Connected (${ms}ms)` : `模型接口连接成功 (${ms}ms)`);
      } catch (err) {
        badge.className = 'text-xs font-medium px-2.5 py-0.5 rounded-full bg-rose-100 text-rose-800';
        badge.textContent = `❌ ${err.message.slice(0, 40)}`;
        badge.classList.remove('hidden');
        showToast(lang === 'en' ? 'Connection failed' : '连接失败，请检查配置');
      } finally {
        btn.disabled = false;
        btn.textContent = t.testConn;
      }
    }

    async function runAiDeepAnalysis(idea, budget, rolePref, privacyPref) {
      const cfg = getAiConfig();
      const t = I18N[lang];
      if (!cfg.apiKey || (cfg.provider === 'custom' && (!cfg.model || !cfg.url))) {
        showToast(lang === 'en' ? 'Missing API key, using local engine' : 'AI 配置不完整，已自动使用本地精准引擎');
        return null;
      }

      const typeLabel = t.types[selectedType] || 'Web';
      const modLabels = Array.from(selectedModules).map(m => t.mods[m]).join(', ');
      const toolIds = TOOLS.map(tl => `${tl.id}(${tl.name},web:${tl.isWebBased})`).join('; ');
      const modelIds = MODELS.map(m => `${m.id}(${m.name},${m.rankBadgeEn})`).join('; ');

      const prompt = `You are an AI software architect. Pick 1 optimal stack and 2 alternatives following "best quality at lowest/free cost for the selected budget". Reply in ${lang === 'en' ? 'English' : 'Chinese'}.
Project: ${typeLabel}, Modules: ${modLabels}, Notes: ${idea || 'none'}, Budget: ${budget}, Workflow: ${rolePref}, Region/Privacy: ${privacyPref}.
Tools: ${toolIds}
Models: ${modelIds}
Return ONLY raw JSON: {"archLabel":"...","reason":"...","picks":[{"toolId":"...","modelId":"...","estCost":"..."}]}`;

      const btnText = document.getElementById('analyzeBtnText');
      btnText.textContent = t.analyzing;

      try {
        let rawText = '';
        if (cfg.provider === 'gemini') {
          const res = await fetch(`${cfg.url}?key=${encodeURIComponent(cfg.apiKey)}`, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          rawText = data.candidates?.[0]?.content?.parts?.[0]?.text || '';
        } else {
          const res = await fetch(cfg.url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${cfg.apiKey}` },
            body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: prompt }], temperature: 0.2 })
          });
          if (!res.ok) throw new Error('HTTP ' + res.status);
          const data = await res.json();
          rawText = data.choices?.[0]?.message?.content || '';
        }

        const jsonMatch = rawText.match(/\{[\s\S]*\}/);
        if (!jsonMatch) throw new Error('Invalid JSON');
        const parsed = JSON.parse(jsonMatch[0]);
        if (!Array.isArray(parsed.picks) || parsed.picks.length === 0) throw new Error('Empty picks');

        const pairs = parsed.picks.map((p, idx) => {
          const tool = TOOLS.find(tl => tl.id === p.toolId) || TOOLS[0];
          const model = MODELS.find(m => m.id === p.modelId) || MODELS[0];
          const quality = Math.round(tool.qualityScore * 0.45 + model.qualityScore * 0.55);
          const cost = Math.round(tool.costScore * 0.45 + model.costScore * 0.55);
          const total = Math.min(98, Math.max(82, Math.round(97 - idx * 3)));
          return { tool, model, estCost: p.estCost || (model.isFree && tool.freeTier ? '$0 / mo' : 'Pay-as-you-go'), quality, cost, ease: tool.easeScore, ecosystem: tool.ecosystemScore, total };
        });

        while (pairs.length < 3) {
          const fallback = computeLocalRecommendations(idea, budget, rolePref, privacyPref).pairs[pairs.length];
          if (fallback) pairs.push(fallback);
          else break;
        }

        showToast(lang === 'en' ? 'AI deep match complete!' : '已完成 AI 深度语义匹配！');
        return { engineLabel: `AI (${cfg.model})`, archLabel: parsed.archLabel || typeLabel, reason: parsed.reason || '', pairs: pairs.slice(0, 3) };
      } catch (err) {
        showToast(lang === 'en' ? 'AI call failed, fell back to local engine' : 'AI 接口调用失败，已自动回退本地精准引擎');
        return null;
      } finally {
        btnText.textContent = t.analyzeBtn;
      }
    }

    async function runAnalysis() {
      const t = I18N[lang];
      const idea = document.getElementById('ideaInput').value.trim();
      const budget = document.getElementById('budgetSelect').value;
      const rolePref = document.getElementById('roleSelect').value;
      const privacyPref = document.getElementById('privacySelect').value;
      const useAi = document.getElementById('useAiToggle').checked;

      let result = null;
      if (useAi) result = await runAiDeepAnalysis(idea, budget, rolePref, privacyPref);
      if (!result) result = computeLocalRecommendations(idea, budget, rolePref, privacyPref);

      const { engineLabel, archLabel, reason, pairs } = result;
      const winner = pairs[0];
      const alts = pairs.slice(1);

      document.getElementById('engineBadge').textContent = engineLabel;
      document.getElementById('detectedArchetype').textContent = archLabel;
      document.getElementById('detectedCostBadge').textContent = `${t.estPrefix}${winner.estCost}`;
      document.getElementById('detectedReason').textContent = reason;
      document.getElementById('matchScoreText').textContent = `${winner.total}%`;

      const toolCat = lang === 'en' ? winner.tool.categoryLabelEn : winner.tool.categoryLabel;
      const toolSum = lang === 'en' ? winner.tool.summaryEn : winner.tool.summary;
      const toolPrice = lang === 'en' ? winner.tool.pricingEn : winner.tool.pricing;
      const toolBasis = lang === 'en' ? winner.tool.evalBasisEn : winner.tool.evalBasis;

      const modRank = lang === 'en' ? winner.model.rankBadgeEn : winner.model.rankBadge;
      const modSum = lang === 'en' ? winner.model.summaryEn : winner.model.summary;
      const modPrice = lang === 'en' ? winner.model.pricingEn : winner.model.pricing;
      const modBasis = lang === 'en' ? winner.model.evalBasisEn : winner.model.evalBasis;

      const webJumpBtn = winner.tool.isWebBased && winner.tool.webUrl
        ? `<a href="${winner.tool.webUrl}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-semibold transition shadow-sm"><span>${t.jumpWeb}</span><span>↗</span></a>`
        : '';

      document.getElementById('winnerCard').innerHTML = `
        <div class="bg-gradient-to-r from-slate-900 via-indigo-950 to-slate-900 px-5 py-3.5 text-white flex flex-wrap items-center justify-between gap-2">
          <div class="flex items-center gap-2.5">
            <span class="px-2.5 py-0.5 rounded-lg bg-indigo-500/30 border border-indigo-400/30 text-xs font-bold">${t.winnerBadge}</span>
            <span class="text-sm sm:text-base font-bold tracking-tight">${winner.tool.name} + ${winner.model.name}</span>
          </div>
          <span class="text-xs font-semibold bg-emerald-400/15 text-emerald-300 border border-emerald-400/30 px-3 py-1 rounded-full">${winner.estCost}</span>
        </div>
        <div class="p-5 sm:p-6 grid grid-cols-1 md:grid-cols-2 gap-6">
          <div class="space-y-3 border-b md:border-b-0 md:border-r border-slate-100 pb-5 md:pb-0 md:pr-6">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-indigo-600 uppercase tracking-wider">${t.toolLabel}</span>
              <span class="text-xs px-2 py-0.5 rounded-md bg-slate-100 text-slate-600 font-medium">${toolCat}</span>
            </div>
            <h4 class="text-lg font-bold text-slate-900">${winner.tool.name}</h4>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${toolSum}</p>
            <div class="text-xs bg-slate-50 rounded-xl p-3 text-slate-700 border border-slate-200/70 space-y-1.5">
              <div><strong>${t.pricingLbl}</strong>${toolPrice}</div>
              <div class="text-slate-500"><strong>${t.basisLbl}</strong>${toolBasis}</div>
            </div>
            <div class="pt-1 flex flex-wrap gap-2">
              <a href="${winner.tool.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-indigo-600 hover:bg-indigo-700 text-white text-xs sm:text-sm font-semibold transition shadow-sm">
                <span>${t.jumpTool} ${winner.tool.name}</span>
                <span>↗</span>
              </a>
              ${webJumpBtn}
            </div>
          </div>

          <div class="space-y-3">
            <div class="flex items-center justify-between">
              <span class="text-xs font-bold text-emerald-600 uppercase tracking-wider">${t.modelLabel}</span>
              <span class="text-xs px-2.5 py-0.5 rounded-md bg-emerald-50 text-emerald-700 border border-emerald-200/70 font-semibold">${modRank}</span>
            </div>
            <h4 class="text-lg font-bold text-slate-900">${winner.model.name}</h4>
            <p class="text-xs sm:text-sm text-slate-600 leading-relaxed">${modSum}</p>
            <div class="text-xs bg-emerald-50/60 rounded-xl p-3 text-emerald-950 border border-emerald-200/60 space-y-1.5">
              <div><strong>${t.costLbl}</strong>${modPrice}</div>
              <div class="text-emerald-800"><strong>${t.rankLbl}</strong>${modBasis}</div>
            </div>
            <div class="pt-1">
              <a href="${winner.model.url}" target="_blank" rel="noopener noreferrer" class="inline-flex items-center gap-1.5 px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-700 text-white text-xs sm:text-sm font-semibold transition shadow-sm">
                <span>${t.jumpModel} ${winner.model.provider}</span>
                <span>↗</span>
              </a>
            </div>
          </div>
        </div>
      `;

      document.getElementById('alternativesList').innerHTML = alts.map((alt, i) => `
        <div class="surface-card rounded-2xl p-4 flex flex-col sm:flex-row sm:items-center justify-between gap-3 hover:border-indigo-300 transition">
          <div class="space-y-1">
            <div class="flex items-center gap-2 flex-wrap">
              <span class="text-xs font-semibold px-2 py-0.5 rounded-md bg-slate-100 text-slate-700">${t.altLabel} ${i + 1} · ${alt.total}%</span>
              <span class="text-sm font-bold text-slate-900">${alt.tool.name} + ${alt.model.name}</span>
            </div>
            <p class="text-xs text-slate-600">${alt.estCost} · ${lang === 'en' ? alt.model.rankBadgeEn : alt.model.rankBadge}</p>
          </div>
          <div class="flex items-center gap-2 shrink-0">
            ${alt.tool.isWebBased && alt.tool.webUrl ? `<a href="${alt.tool.webUrl}" target="_blank" rel="noopener noreferrer" class="px-2.5 py-1.5 rounded-xl border border-amber-300 bg-amber-50 hover:bg-amber-100 text-xs font-medium text-amber-800 transition">${t.altWeb}</a>` : ''}
            <a href="${alt.tool.url}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl border border-slate-300 hover:border-indigo-500 hover:text-indigo-600 text-xs font-medium text-slate-700 transition">${t.altTool}</a>
            <a href="${alt.model.url}" target="_blank" rel="noopener noreferrer" class="px-3 py-1.5 rounded-xl border border-emerald-300 bg-emerald-50 hover:bg-emerald-100 text-xs font-medium text-emerald-700 transition">${t.altModel}</a>
          </div>
        </div>
      `).join('');

      document.getElementById('starterConfig').textContent = generateTailoredPrompt(idea, winner, budget);
      renderChart(pairs);
    }

    function renderChart(pairs) {
      const ctx = document.getElementById('comparisonChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();
      const labels = I18N[lang].chartAxes;
      const colors = [
        { border: '#4f46e5', bg: 'rgba(79, 70, 229, 0.18)' },
        { border: '#10b981', bg: 'rgba(16, 185, 129, 0.14)' },
        { border: '#f59e0b', bg: 'rgba(245, 158, 11, 0.12)' }
      ];
      chartInstance = new Chart(ctx, {
        type: 'radar',
        data: {
          labels,
          datasets: pairs.map((p, idx) => ({
            label: `${p.tool.name.split(' ')[0]} + ${p.model.provider.split('/')[0]}`,
            data: [p.quality, p.cost, p.ease, p.ecosystem],
            borderColor: colors[idx % 3].border,
            backgroundColor: colors[idx % 3].bg,
            borderWidth: 2,
            pointRadius: 3
          }))
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: { r: { min: 45, max: 100, ticks: { stepSize: 15, font: { size: 10 } }, pointLabels: { font: { size: 11, weight: '600' } } } },
          plugins: { legend: { position: 'bottom', labels: { boxWidth: 10, font: { size: 11 } } } }
        }
      });
    }

    async function syncLiveModels(silent = false) {
      const t = I18N[lang];
      const syncBtn = document.getElementById('syncBtn');
      const syncIcon = document.getElementById('syncIcon');
      const syncText = document.getElementById('syncText');
      syncIcon.textContent = '⏳';
      syncText.textContent = t.syncing;
      syncBtn.disabled = true;

      try {
        const res = await fetch('https://openrouter.ai/api/v1/models');
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const json = await res.json();
        const models = Array.isArray(json.data) ? json.data : [];
        liveFreeModels = models
          .filter(m => m.pricing && String(m.pricing.prompt) === '0' && String(m.pricing.completion) === '0')
          .sort((a, b) => (b.created || 0) - (a.created || 0) || (b.context_length || 0) - (a.context_length || 0))
          .slice(0, 30);

        syncIcon.textContent = '✅';
        syncText.textContent = t.synced;
        runAnalysis();
        if (!silent) showToast(lang === 'en' ? `Synced ${liveFreeModels.length} live free models` : `已同步 ${liveFreeModels.length} 个最新免费大模型与实时价格`);
      } catch (err) {
        syncIcon.textContent = '🔄';
        syncText.textContent = t.syncBtn;
        if (!silent) showToast(lang === 'en' ? 'Sync failed, using 2026-11 baseline' : '实时同步失败，当前使用 2026-11-19 最新内置基准库');
      } finally {
        syncBtn.disabled = false;
      }
    }

    function copyText(text, okMsg) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(() => showToast(okMsg)).catch(() => fallbackCopy(text, okMsg));
      } else {
        fallbackCopy(text, okMsg);
      }
    }

    function fallbackCopy(text, okMsg) {
      const ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try {
        document.execCommand('copy');
        showToast(okMsg);
      } catch (e) {
        showToast('Copy failed');
      }
      document.body.removeChild(ta);
    }

    // =========================================================================
    // 6. INIT & EVENT LISTENERS
    // =========================================================================
    document.addEventListener('DOMContentLoaded', () => {
      try {
        const savedLang = localStorage.getItem('ai_match_lang');
        if (savedLang === 'en' || savedLang === 'zh') lang = savedLang;
      } catch (e) {}

      document.getElementById('langBtn').addEventListener('click', () => {
        lang = lang === 'zh' ? 'en' : 'zh';
        try { localStorage.setItem('ai_match_lang', lang); } catch (e) {}
        applyLanguage();
        runAnalysis();
      });

      document.querySelectorAll('.type-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          selectedType = btn.getAttribute('data-type');
          document.querySelectorAll('.type-pill').forEach(b => {
            b.classList.remove('pill-active');
            b.classList.add('pill-inactive');
          });
          btn.classList.add('pill-active');
          btn.classList.remove('pill-inactive');
          runAnalysis();
        });
      });

      document.querySelectorAll('.mod-pill').forEach(btn => {
        btn.addEventListener('click', () => {
          const mod = btn.getAttribute('data-mod');
          if (selectedModules.has(mod)) {
            if (selectedModules.size > 1) {
              selectedModules.delete(mod);
              btn.classList.remove('mod-active');
              btn.classList.add('mod-inactive');
            }
          } else {
            selectedModules.add(mod);
            btn.classList.add('mod-active');
            btn.classList.remove('mod-inactive');
          }
          runAnalysis();
        });
      });

      document.getElementById('useAiToggle').addEventListener('change', e => {
        const row = document.getElementById('aiKeyRow');
        if (e.target.checked) row.classList.remove('hidden');
        else row.classList.add('hidden');
      });

      document.getElementById('aiProviderSelect').addEventListener('change', e => {
        const val = e.target.value;
        const builtinWrap = document.getElementById('builtinKeyWrap');
        const customFields = document.getElementById('customModelFields');
        const freeHint = document.getElementById('freeKeyHintRow');
        const link = document.getElementById('getFreeKeyLink');
        document.getElementById('connStatusBadge').classList.add('hidden');

        if (val === 'custom') {
          builtinWrap.classList.add('hidden');
          customFields.classList.remove('hidden');
          freeHint.classList.add('hidden');
        } else {
          builtinWrap.classList.remove('hidden');
          customFields.classList.add('hidden');
          freeHint.classList.remove('hidden');
          link.href = val === 'gemini' ? 'https://aistudio.google.com/apikey' : 'https://openrouter.ai/keys';
        }
      });

      document.getElementById('testConnBtn').addEventListener('click', testAiConnection);

      document.getElementById('analyzeBtn').addEventListener('click', async () => {
        await runAnalysis();
        const rc = document.getElementById('resultsContainer');
        rc.classList.remove('fade-in');
        void rc.offsetWidth;
        rc.classList.add('fade-in');
        document.getElementById('analysisSummary').scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        showToast(lang === 'en' ? '✅ Stack recommendation updated' : '✅ 已完成智能匹配与方案更新');
      });

      let _ideaTimer = null;
      document.getElementById('ideaInput').addEventListener('input', () => {
        clearTimeout(_ideaTimer);
        _ideaTimer = setTimeout(runAnalysis, 350);
      });
      document.getElementById('ideaInput').addEventListener('keydown', e => {
        if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') runAnalysis();
      });

      ['budgetSelect', 'roleSelect', 'privacySelect'].forEach(id => {
        document.getElementById(id).addEventListener('change', runAnalysis);
      });

      document.getElementById('syncBtn').addEventListener('click', () => syncLiveModels(false));
      document.getElementById('copyConfigBtn').addEventListener('click', () => {
        copyText(document.getElementById('starterConfig').textContent, I18N[lang].copiedToast);
      });

      applyLanguage();
      runAnalysis();
      syncLiveModels(true);
    });
  </script>
</body>
</html>
